packages:
  - '.'
  - 'web'

# Every advisory below is in a transitive dependency this project never loads:
# the whole `@wagmi/connectors` tree is pulled in by `wagmi` but never imported, because the
# app uses EIP-6963 discovery instead (see web/lib/wagmi.ts). Pinning them forward anyway
# keeps `pnpm audit` clean, so a real advisory is not lost in the noise of accepted ones.
overrides:
  axios@<1.18.0: '>=1.18.0'
  ws@<8.21.0: '>=8.21.0'
  uuid@<11.1.1: '>=11.1.1'
  postcss@<8.5.10: '>=8.5.10'
  adm-zip@<0.6.0: '>=0.6.0'
  # sharp is next's optional image-optimization dependency, and is built (see allowBuilds
  # below), so this one is a real patch rather than a never-loaded transitive pin.
  sharp@<0.35.0: '>=0.35.0'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  bufferutil: false
  keccak: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - hardhat@3.11.0
